apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    security: monitored
---
apiVersion: v1
kind: Service
metadata:
  name: payment-backend
  namespace: production
spec:
  selector:
    app: payment-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-backend
  namespace: production
  labels:
    app: payment-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-backend
  template:
    metadata:
      labels:
        app: payment-backend
        security.monitor: "true"
    spec:
      containers:
      - name: backend
        image: localhost/payment-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        # Credentials that will be stolen by the fileless malware
        - name: AWS_ACCESS_KEY_ID
          value: "AKIAIOSFODNN7EXAMPLE"
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        - name: DATABASE_URL
          value: "postgresql://admin:SuperSecret123@db.prod.internal:5432/payments"
        - name: STRIPE_API_KEY
          value: "sk_live_51JabcdefghijklmnopQRSTUVWXYZ"
        - name: PAYMENT_GATEWAY_TOKEN
          value: "pgw_live_abc123xyz789secrettoken"
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
