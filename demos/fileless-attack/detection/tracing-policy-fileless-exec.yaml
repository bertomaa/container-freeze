apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: detect-and-freeze-fileless-exec
spec:
  # SAFETY FIX: Only apply this policy to the victim pod
  # This protects kube-system and host processes from being frozen
  podSelector:
    matchLabels:
      app: payment-backend

  kprobes:
  # 1. BLOCKING: Credential Theft (Token & Env Vars)
  - call: "sys_openat"
    syscall: true
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "string"
    - index: 2
      type: "int"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Prefix"
        values:
        - "/var/run/secrets/kubernetes.io/serviceaccount"
        - "/proc/self/environ"
        - "/etc/shadow"
      matchActions:
      - action: Signal
        argSig: 19  # SIGSTOP

  # Fallback for 'open' syscall (legacy compatibility)
  - call: "sys_open"
    syscall: true
    args:
    - index: 0
      type: "string"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/var/run/secrets/kubernetes.io/serviceaccount"
        - "/proc/self/environ"
      matchActions:
      - action: Signal
        argSig: 19

  # 2. LOGGING: Network Connect (Allow download, just log it)
  - call: "tcp_connect"
    syscall: false
    return: true
    args:
    - index: 0
      type: "sock"
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/local/bin/python3"
        - "/usr/bin/python3"
      matchActions:
      - action: Post