name: fileless-attack
display_name: "Fileless Supply Chain Attack"
description: "API-triggered fileless malware via hidden backdoor in health endpoint - Tetragon BLOCKS with SIGSTOP and CRIU captures in-memory script"
version: "2.0.0"

scenario:
  attack_type: "supply-chain-fileless"
  trigger: "GET /api/health with X-Debug: enable header"
  detection: "Tetragon SIGSTOP on credential file access"
  response: "CRIU checkpoint before termination"
  threat_actor: "APT-style"
  objectives:
    - "Fileless script execution (memory-only)"
    - "Credential theft from Kubernetes service account"
    - "Data exfiltration"
    - "Demonstrate Tetragon blocking mode (SIGSTOP)"
    - "Demonstrate CRIU memory capture of in-memory scripts"

images:
  - name: payment-backend
    path: ./app
  - name: payload-server
    path: ./payload-server

deployments:
  - ./payload-server/deployment.yaml
  - ./app/deployment.yaml

detection_policies:
  - ./detection/tracing-policy-fileless-exec.yaml
  - ./detection/tracing-policy-network.yaml

namespaces:
  - production
  - malicious-cdn

target_pod:
  namespace: production
  label: app=payment-backend
  container: backend
