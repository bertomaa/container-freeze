apiVersion: v1
kind: Namespace
metadata:
  name: attacker-infra
  labels:
    purpose: demo-c2
---
apiVersion: v1
kind: Service
metadata:
  name: c2-server
  namespace: attacker-infra
spec:
  selector:
    app: c2-server
  ports:
    - name: shell
      protocol: TCP
      port: 4444
      targetPort: 4444
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c2-server
  namespace: attacker-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c2-server
  template:
    metadata:
      labels:
        app: c2-server
    spec:
      containers:
      - name: c2
        image: localhost/c2-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4444
        - containerPort: 8080
