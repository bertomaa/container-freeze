apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    security: monitored
---
apiVersion: v1
kind: Service
metadata:
  name: payment-processor
  namespace: production
spec:
  selector:
    app: payment-processor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: production
  labels:
    app: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
        # These labels will be used by Tetragon for monitoring
        security.monitor: "true"
    spec:
      # Shared volume for signal file between app and malware
      volumes:
      - name: shared-tmp
        emptyDir: {}

      containers:
      # Main application container
      - name: app
        image: localhost/vulnerable-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        # Simulate leaked credentials (will be extracted in forensics)
        - name: AWS_ACCESS_KEY_ID
          value: "AKIAIOSFODNN7EXAMPLE"
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        - name: DATABASE_URL
          value: "postgresql://admin:SuperSecret123@db.prod.internal:5432/payments"
        - name: STRIPE_API_KEY
          value: "sk_live_51JabcdefghijklmnopQRSTUVWXYZ"
        volumeMounts:
        - name: shared-tmp
          mountPath: /tmp
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL

      # Malware sidecar (simulates supply chain injection)
      # In reality, this would be injected via compromised base image or dependency
      - name: malware-sidecar
        image: localhost/sleepy-malware:latest
        imagePullPolicy: Never
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: shared-tmp
          mountPath: /tmp
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
